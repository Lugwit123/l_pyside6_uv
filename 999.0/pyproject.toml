[project]
name = "l-pyside6-uv"
version = "0.1.0"
description = "PySide6 development scaffold managed by uv"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "matplotlib>=3.9.4",
    "numpy>=2.0.2",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pillow>=11.3.0",
    "pyside6>=6.6",
    "requests>=2.32.5",
    "scikit-learn>=1.6.1",
    "scipy>=1.13.1",
    "tqdm>=4.70.0",
]

[project.scripts]
l-pyside6-uv = "l_pyside6_uv.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/l_pyside6_uv"]

[tool.uv]
package = true
