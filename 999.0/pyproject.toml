[project]
name = "l-pyside6-uv"
version = "0.1.0"
description = "PySide6 development scaffold managed by uv"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PySide6>=6.6",
]

[project.scripts]
l-pyside6-uv = "l_pyside6_uv.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/l_pyside6_uv"]

[tool.uv]
package = true
